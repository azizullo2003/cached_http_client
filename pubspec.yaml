name: cached_http_client
description: >-
  An HTTP client for Flutter that transparently caches GET and HEAD responses
  in memory or on disk, with configurable expiry and pluggable storage.
version: 1.0.0
repository: https://github.com/azizullo2003/cached_http_client
issue_tracker: https://github.com/azizullo2003/cached_http_client/issues

topics:
  - http
  - cache
  - networking
  - offline

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.3
  http: ^1.2.2
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
